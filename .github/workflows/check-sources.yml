# Слежение за страницами программ — раз в сутки, на машине GitHub.
#
# Зачем робот, а не «запущу сам»: требования на сайтах меняются молча и
# в любой день, а человек вспоминает про проверку раз в месяц. К тому
# времени карточка уже успела соврать кому-то, кто на неё полагался.
#
# Частоту для каждой программы выбирает сам check.py по близости срока:
# ближе тридцати дней — ежедневно, до девяноста — еженедельно, дальше —
# ежемесячно. Поэтому робот просто заходит каждый день, а решает скрипт.
name: Проверка источников

on:
  schedule:
    # 05:00 UTC — 10:00 в Душанбе. Время без нагрузки на серверы вузов.
    - cron: "0 5 * * *"
  workflow_dispatch:

# Нужно, чтобы записать в репозиторий новые даты проверки. Без записи
# расписание не работает: lastVerified не сдвинется, и каждый прогон
# будет заново дёргать все программы.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Сверить страницы с записанными хешами
        id: check
        run: python -m tools.check

      # Даты проверки записываются даже когда шаг выше упал: программа,
      # которая не менялась, всё равно проверена, и терять это незачем.
      - name: Записать новые даты проверки
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/programs)" ]; then
            echo "Записи не изменились, коммитить нечего."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/programs
          git commit -m "Слежение: источники проверены $(date -u +%Y-%m-%d)"
          # Не роняем прогон, если записать не дали: цвет прогона должен
          # означать «требования изменились», и ничего больше. Иначе он
          # краснеет каждый день и перестаёт что-либо значить.
          git push || echo "ЗАПИСАТЬ ДАТЫ НЕ ВЫШЛО. Settings -> Actions -> General -> Workflow permissions -> Read and write."

