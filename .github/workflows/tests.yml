# Тесты на каждую отправку в main.
#
# Локально их можно забыть прогнать, и забывают ровно тогда, когда
# правка кажется мелкой. Робот не забывает.
name: Тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Поставить зависимости сборщика
        run: pip install -r requirements.txt

      - name: Тесты сборщика
        run: python -m unittest discover -s tools/tests -t .

      - name: Тесты движка
        run: node --test

      - name: Индекс собирается и влезает в предел
        run: python -m tools.build

      # Сайт публикуется из закоммиченных index.json/details.json/conditions.
      # Если правили data/programs и не пересобрали, карточка не доедет до людей.
      - name: Собранные файлы совпадают с data/programs
        run: |
          # Дата сборки (generatedAt) меняется каждый день и сама по себе не
          # значит, что данные устарели: сравниваем всё остальное.
          if ! git diff -I'"generatedAt"' --quiet data feed.xml || [ -n "$(git ls-files --others --exclude-standard data feed.xml)" ]; then
            git status --short data feed.xml
            echo "Собранные файлы устарели: запусти python -m tools.build и закоммить data/ и feed.xml."
            exit 1
          fi
