# Адреса вписывает человек, руками, с официального сайта программы.
# Поисковиком пользоваться нельзя: агентские сайты ранжируются выше
# первоисточников и врут в требованиях.
#
# Формат записи:
#
# [program-id]
# name = "Название программы"
# urls = ["https://официальный-сайт/страница-с-требованиями"]
# approvedBy = "human"
# approvedAt = "2026-09-03"

# Централизованные вступительные экзамены Таджикистана.
# Одна запись покрывает все государственные вузы страны сразу: без ЦВЭ
# в них не поступить, а внутри одной заявки абитуриент выбирает вузы.
#
# Домен ntc.tj утверждён человеком. Страницы внутри домена выбраны по
# оглавлению руководства «Роҳнамои довталаб — 2026»:
#   id=684 — «Бақайдгирии довталаб ва талаботи он» (кто имеет право
#            регистрироваться — основной источник правил допуска)
#   id=696 — «Имтиҳонҳо ва даврҳои он» (порядок и периоды экзаменов)
#
# Сайт только на таджикском: русской версии по адресу /ru/ нет, отдаёт 404.
[imd-tajikistan]
name = "Имтиҳонҳои марказонидаи дохилшавӣ (ИМД)"
urls = [
  "https://ntc.tj/tj/ba-dovtalab/rohnamoi-dovtalab.html?view=article&id=684",
  "https://ntc.tj/tj/ba-dovtalab/rohnamoi-dovtalab.html?view=article&id=696",
]
approvedBy = "human"
approvedAt = "2026-09-03"
# «Диданд: 48745» — счётчик просмотров, растёт при каждом заходе. Без этой
# строки хеш страницы менялся бы после каждой проверки, и слежение
# сообщало бы об изменении требований там, где ничего не менялось.
volatile = ["Диданд: \\d+"]
