# Stipendium Hungaricum — государственная стипендия Венгрии.
#
# Домен stipendiumhungaricum.hu утверждён человеком. Три источника:
#   /apply/    — сроки и порядок подачи
#   /partners/ — страны-партнёры и доступные им направления. Таджикистану
#                открыт в том числе Computer Science and Information
#                Technology; без партнёрства подать нельзя вообще
#   PDF        — «Call for Applications», настоящие правила допуска.
#                На сайте их нет: ни возраста, ни языка, ни ограничений.
#
# ВНИМАНИЕ: адрес PDF содержит номер цикла (2026_27) и через год
# перестанет существовать. Это не поломка, а норма для PDF: check.py
# скажет «источник недоступен», и новый адрес впишет человек.
# Квота Правительства России — государственное финансирование обучения
# для иностранных граждан, отбор идёт через Россотрудничество в своей
# стране.
#
# Домен education-in-russia.com утверждён человеком. Источник ручной:
# портал рисуется JavaScript-ом и отдаёт программе ноль символов текста.
#
# Сохранять надо через «Веб-страница, полностью» (Ctrl+S), а не печатью в
# PDF. Проверено 4 сентября 2026: страница построена на сворачивающихся
# блоках, печать сняла одни заголовки — 519 символов вместо восьми тысяч.
# Сохранение разметки берёт и свёрнутое тоже.
#
# Портал висит с пометкой «работает в режиме опытной эксплуатации».
# Требований к возрасту и баллу на нём нет вовсе: их определяет отбор в
# конкретной стране. Поэтому запись будет бедной на правила и богатой на
# текстовые условия — они здесь и есть главная польза.
[russia-quota]
name = "Квота Правительства Российской Федерации"
files = [
  { path = "manual/russia-quota/admission-process.html", url = "https://education-in-russia.com/how-to-proceed/admission-process" },
  { path = "manual/russia-quota/recognition.html", url = "https://education-in-russia.com/how-to-proceed/recognition-of-education" },
]
approvedBy = "human"
approvedAt = "2026-09-04"

