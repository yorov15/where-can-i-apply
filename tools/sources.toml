# MIT — приём на бакалавриат.
#
# Гражданство не влияет ни на порядок подачи, ни на размер помощи, а
# помощь закрывает нужду целиком. Для выпускника из Таджикистана это
# редкий случай: деньги не отдельный конкурс, а следствие поступления.
#
# Домен mitadmissions.org утверждён человеком 7 сентября 2026.
