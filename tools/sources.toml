# Адреса вписывает человек, руками, с официального сайта программы.
# Поисковиком пользоваться нельзя: агентские сайты ранжируются выше
# первоисточников и врут в требованиях.
#
# Формат записи:
#
# [program-id]
# name = "Название программы"
# urls = ["https://официальный-сайт/страница-с-требованиями"]
# approvedBy = "human"
# approvedAt = "2026-09-03"

# Централизованные вступительные экзамены Таджикистана.
# Одна запись покрывает все государственные вузы страны сразу: без ЦВЭ
# в них не поступить, а внутри одной заявки абитуриент выбирает вузы.
#
# Домен ntc.tj утверждён человеком. Страницы внутри домена выбраны по
# оглавлению руководства «Роҳнамои довталаб — 2026»:
#   id=684 — «Бақайдгирии довталаб ва талаботи он» (кто имеет право
#            регистрироваться — основной источник правил допуска)
#   id=696 — «Имтиҳонҳо ва даврҳои он» (порядок и периоды экзаменов)
#
# Сайт только на таджикском: русской версии по адресу /ru/ нет, отдаёт 404.
[imd-tajikistan]
name = "Имтиҳонҳои марказонидаи дохилшавӣ (ИМД)"
urls = [
  "https://ntc.tj/tj/ba-dovtalab/rohnamoi-dovtalab.html?view=article&id=684",
  "https://ntc.tj/tj/ba-dovtalab/rohnamoi-dovtalab.html?view=article&id=696",
]
approvedBy = "human"
approvedAt = "2026-09-03"
# «Диданд: 48745» — счётчик просмотров, растёт при каждом заходе. Без этой
# строки хеш страницы менялся бы после каждой проверки, и слежение
# сообщало бы об изменении требований там, где ничего не менялось.
volatile = ["Диданд: \\d+"]

# Türkiye Bursları — государственная стипендия Турции.
# Одна заявка покрывает много вузов сразу: человек выбирает их внутри
# заявки, а не подаётся в каждый отдельно. Точное число на утверждённых
# страницах не названо, поэтому здесь его нет.
#
# Домен turkiyeburslari.gov.tr утверждён человеком. Страницы выбраны так,
# чтобы ни одна не была привязана к одному циклу приёма:
#   /scholarshipsprograms — критерии: балл, возраст, кто допускается
#   /calendar             — окно подачи, повторяется ежегодно
#   /fulltimeprograms     — что покрывает стипендия
#
# Страница объявления 2026 года сюда намеренно не включена: её адрес
# содержит номер цикла и через год перестанет существовать, а слежение
# будет вечно сообщать об исчезнувшем источнике.
[turkiye-burslari]
name = "Türkiye Bursları"
urls = [
  "https://turkiyeburslari.gov.tr/scholarshipsprograms",
  "https://turkiyeburslari.gov.tr/calendar",
  "https://turkiyeburslari.gov.tr/fulltimeprograms",
]
approvedBy = "human"
approvedAt = "2026-09-03"

# Global Korea Scholarship — государственная стипендия Кореи.
# Приглашает учиться в корейских вузах с годом языковой подготовки;
# подача идёт через посольство или напрямую в вуз.
#
# Домен studyinkorea.go.kr утверждён человеком. Страница одна: на ней
# лежат критерии допуска для всех ступеней сразу, включая бакалавриат.
#
# Точных дат приёма страница не даёт — только «September - October».
# Записывать выдуманные числа нельзя, поэтому даты остаются пустыми, а
# окно уходит в текстовое условие.
[gks-korea]
name = "Global Korea Scholarship (GKS)"
urls = [
  "https://www.studyinkorea.go.kr/en/plan/scholarship.do",
]
approvedBy = "human"
approvedAt = "2026-09-03"

# Stipendium Hungaricum — государственная стипендия Венгрии.
#
# Домен stipendiumhungaricum.hu утверждён человеком. Три источника:
#   /apply/    — сроки и порядок подачи
#   /partners/ — страны-партнёры и доступные им направления. Таджикистану
#                открыт в том числе Computer Science and Information
#                Technology; без партнёрства подать нельзя вообще
#   PDF        — «Call for Applications», настоящие правила допуска.
#                На сайте их нет: ни возраста, ни языка, ни ограничений.
#
# ВНИМАНИЕ: адрес PDF содержит номер цикла (2026_27) и через год
# перестанет существовать. Это не поломка, а норма для PDF: check.py
# скажет «источник недоступен», и новый адрес впишет человек.
# Квота Правительства России — государственное финансирование обучения
# для иностранных граждан, отбор идёт через Россотрудничество в своей
# стране.
#
# Домен education-in-russia.com утверждён человеком. Источник ручной:
# портал рисуется JavaScript-ом и отдаёт программе ноль символов текста.
# Человек открывает страницы сам и печатает их в PDF — печать снимает то,
# что нарисовано на экране, в отличие от «сохранить как».
#
# Портал висит с пометкой «работает в режиме опытной эксплуатации».
# Требований к возрасту и баллу на нём нет вовсе: их определяет отбор в
# конкретной стране. Поэтому запись будет бедной на правила и богатой на
# текстовые условия — они здесь и есть главная польза.
[russia-quota]
name = "Квота Правительства Российской Федерации"
files = [
  { path = "manual/russia-quota/admission-process.pdf", url = "https://education-in-russia.com/how-to-proceed/admission-process" },
  { path = "manual/russia-quota/recognition.pdf", url = "https://education-in-russia.com/how-to-proceed/recognition-of-education" },
]
approvedBy = "human"
approvedAt = "2026-09-04"

# MEXT — государственная стипендия Японии.
#
# Домен studyinjapan.go.jp утверждён человеком. Страница одна: на ней
# лежат требования ко всем семи типам стипендии, включая бакалавриат, и
# что она покрывает.
#
# Подробные гайдлайны раздают посольства, и в вебе их единого адреса нет.
# Поэтому запись строится по этой странице, а всё, что решает посольство,
# уходит в текстовые условия.
[mext-japan]
name = "Japanese Government (MEXT) Scholarship"
urls = [
  "https://www.studyinjapan.go.jp/en/planning/scholarships/mext-scholarships/",
]
approvedBy = "human"
approvedAt = "2026-09-04"

[stipendium-hungaricum]
name = "Stipendium Hungaricum"
urls = [
  "https://stipendiumhungaricum.hu/apply/",
  "https://stipendiumhungaricum.hu/partners/",
  "https://stipendiumhungaricum.hu/wp-content/uploads/2025/10/BA_MA_OTM_Call_for_Applications_2026_27.pdf",
]
approvedBy = "human"
approvedAt = "2026-09-04"
