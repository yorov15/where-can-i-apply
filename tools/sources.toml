#   /international          — что значит «иностранец» и как это влияет
#   /tests-scores           — минимальные баллы по языку
#   /afford                 — сколько закрывают деньгами
#
# volatile: наверху каждой страницы висит объявление о том, что офис
# закрыт в такой-то день. Оно меняется, и без чистки слежение сообщало
# бы об изменении требований после каждого праздника.
[mit]
name = "MIT — first-year admissions"
