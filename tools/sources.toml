# Амхерст. Домен amherst.edu одобрен человеком 14 сентября 2026. Нужен
# потому, что это единственный колледж в списке, где need-blind
# распространяется и на иностранцев: решение о приёме не смотрит на
# заявку о помощи.
#
# Страницы сохранены вручную: сборщику сайт отвечает 405, браузеру
# отдаёт всё. Подделывать имя клиента ради обхода защиты нельзя, поэтому
# текст снят браузером и лежит в manual/. Плата за это — слежение: пока
# файлы не пересохранены, tools.check видит прежний текст и об
# изменениях на сайте не скажет. Перечитывать вручную раз в цикл.
[amherst-college]
name = "Amherst College — need-blind financial aid for international students"
files = [
  { path = "manual/amherst-college/00-international.txt", url = "https://www.amherst.edu/admission/apply/international" },
  { path = "manual/amherst-college/01-aid-international.txt", url = "https://www.amherst.edu/offices/financialaid/international_students" },
